name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push on the same ref cancels superseded runs instead of queueing
# behind them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build, vet, test, race (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: race
        run: go test -count=1 -race ./...

  windows-build:
    name: windows cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: go build (GOOS=windows)
        run: GOOS=windows GOARCH=amd64 go build ./...
